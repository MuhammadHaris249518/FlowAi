<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Talkse Call</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #16181d; --muted: #667085;
    --accent: #1565c0; --accent-text: #ffffff; --caller: #e8f0fe; --ai: #f1f3f5;
    --danger: #c62828; --border: #e4e7ec;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115; --card: #171a21; --text: #eceef2; --muted: #98a2b3;
      --accent: #4c8dff; --accent-text: #0f1115; --caller: #1d2a44; --ai: #22262f;
      --danger: #ef5350; --border: #2a2f3a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 560px; margin: 0 auto; padding: 24px 16px 40px; }
  header h1 { margin: 0; font-size: 22px; }
  header p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    padding: 16px; margin-top: 16px;
  }
  #status { color: var(--muted); font-size: 14px; min-height: 20px; display: flex; align-items: center; gap: 8px; }
  #status.error { color: var(--danger); }
  .spinner {
    width: 14px; height: 14px; border: 2px solid var(--border); border-top-color: var(--accent);
    border-radius: 50%; animation: spin .8s linear infinite; display: none;
  }
  .busy .spinner { display: inline-block; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #chat { display: flex; flex-direction: column; gap: 8px; min-height: 120px; max-height: 50vh; overflow-y: auto; }
  .bubble { padding: 10px 12px; border-radius: 12px; max-width: 85%; white-space: pre-wrap; }
  .bubble.caller { background: var(--caller); align-self: flex-end; }
  .bubble.assistant { background: var(--ai); align-self: flex-start; }
  .empty { color: var(--muted); font-size: 14px; text-align: center; margin: auto; }
  .controls { display: flex; flex-direction: column; align-items: center; gap: 12px; margin-top: 20px; }
  button {
    font: inherit; border: none; border-radius: 999px; cursor: pointer;
    background: var(--accent); color: var(--accent-text);
  }
  button:disabled { opacity: .45; cursor: not-allowed; }
  #start { padding: 12px 28px; font-weight: 600; }
  #talk {
    width: 132px; height: 132px; font-weight: 600; font-size: 17px;
    user-select: none; -webkit-user-select: none; touch-action: none;
    transition: transform .1s;
  }
  #talk.recording { background: var(--danger); transform: scale(1.06); }
  .hint { color: var(--muted); font-size: 13px; text-align: center; }
</style>
</head>
<body>
<main>
  <header>
    <h1 id="biz-name">Talkse</h1>
    <p id="biz-tagline">AI receptionist</p>
  </header>

  <div class="card">
    <div id="chat"><div class="empty" id="empty">Press "Start call" to talk to the receptionist.</div></div>
  </div>

  <div class="controls">
    <button id="start">Start call</button>
    <button id="talk" disabled>Hold to talk</button>
    <div id="status"><span class="spinner"></span><span id="status-text"></span></div>
    <div class="hint">Hold the button while you speak, release when you're done. Works with the space bar too.</div>
  </div>
</main>

<script>
  const chat = document.getElementById("chat");
  const startBtn = document.getElementById("start");
  const talkBtn = document.getElementById("talk");
  const statusBox = document.getElementById("status");
  const statusText = document.getElementById("status-text");

  let callId = null;
  let stream = null;
  let recorder = null;
  let chunks = [];
  let recordStart = 0;
  let busy = false;
  let audioEl = null;

  // Safari records audio/mp4, Chrome/Firefox audio/webm; Groq accepts both
  const MIME = ["audio/webm;codecs=opus", "audio/webm", "audio/mp4"].find(
    t => window.MediaRecorder && MediaRecorder.isTypeSupported(t)
  ) || "";
  const EXT = MIME.includes("mp4") ? "m4a" : "webm";

  function setStatus(text, { spinning = false, error = false } = {}) {
    statusText.textContent = text;
    statusBox.classList.toggle("busy", spinning);
    statusBox.classList.toggle("error", error);
  }

  function addBubble(role, text) {
    const empty = document.getElementById("empty");
    if (empty) empty.remove();
    const div = document.createElement("div");
    div.className = `bubble ${role}`;
    div.textContent = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
  }

  // Fallback when server TTS (Deepgram) fails: the browser's built-in voice reads the text
  function speakInBrowser(text) {
    if (!text || !window.speechSynthesis) return Promise.resolve();
    speechSynthesis.cancel();
    return new Promise(resolve => {
      const u = new SpeechSynthesisUtterance(text);
      u.lang = "en-US";
      u.onend = resolve;
      u.onerror = resolve;
      speechSynthesis.speak(u);
    });
  }

  function play(b64, text) {
    if (!b64) return speakInBrowser(text);
    if (audioEl) audioEl.pause();
    audioEl = new Audio(`data:audio/mpeg;base64,${b64}`);
    return new Promise(resolve => {
      audioEl.onended = resolve;
      audioEl.onerror = resolve;
      audioEl.play().catch(resolve);
    });
  }

  function endCall(status) {
    talkBtn.disabled = true;
    startBtn.disabled = false;
    startBtn.textContent = "New call";
    const labels = {
      done: "Call complete.",
      needs_human: "A team member will follow up.",
      emergency: "Call ended: please follow the safety instructions.",
    };
    setStatus(labels[status] || "Call ended.");
  }

  async function startCall() {
    startBtn.disabled = true;
    chat.innerHTML = "";
    setStatus("Connecting…", { spinning: true });
    try {
      // Ask for the mic first so the permission prompt appears on the user's click
      if (!stream) stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const res = await fetch("/api/calls", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({}),
      });
      if (!res.ok) throw new Error(`Server error ${res.status}`);
      const data = await res.json();
      callId = data.call_id;
      addBubble("assistant", data.reply_text);
      setStatus("Receptionist is speaking…");
      await play(data.audio_b64, data.reply_text);
      talkBtn.disabled = false;
      setStatus("Your turn: hold the button and speak.");
    } catch (err) {
      startBtn.disabled = false;
      const msg = err.name === "NotAllowedError"
        ? "Microphone permission was denied. Allow it in the browser and try again."
        : `Could not start the call: ${err.message}`;
      setStatus(msg, { error: true });
    }
  }

  function startRecording() {
    if (!callId || busy || talkBtn.disabled || recorder) return;
    if (audioEl) audioEl.pause();
    if (window.speechSynthesis) speechSynthesis.cancel();
    chunks = [];
    recorder = new MediaRecorder(stream, MIME ? { mimeType: MIME } : undefined);
    recorder.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
    recorder.onstop = sendTurn;
    recordStart = Date.now();
    recorder.start();
    talkBtn.classList.add("recording");
    talkBtn.textContent = "Listening…";
    setStatus("Release when you're done.");
  }

  function stopRecording() {
    if (!recorder) return;
    talkBtn.classList.remove("recording");
    talkBtn.textContent = "Hold to talk";
    recorder.stop();
  }

  async function sendTurn() {
    recorder = null;
    if (Date.now() - recordStart < 400) {
      setStatus("That was too short. Hold the button while you speak.");
      return;
    }
    const blob = new Blob(chunks, { type: MIME || "audio/webm" });
    const form = new FormData();
    form.append("audio", blob, `turn.${EXT}`);

    busy = true;
    talkBtn.disabled = true;
    setStatus("Thinking…", { spinning: true });
    try {
      const res = await fetch(`/api/calls/${callId}/turn`, { method: "POST", body: form });
      if (!res.ok) throw new Error(`Server error ${res.status}`);
      const data = await res.json();
      if (data.transcript) addBubble("caller", data.transcript);
      addBubble("assistant", data.reply_text);
      setStatus("Receptionist is speaking…");
      await play(data.audio_b64, data.reply_text);
      if (data.status === "collecting") {
        talkBtn.disabled = false;
        setStatus("Your turn: hold the button and speak.");
      } else {
        endCall(data.status);
      }
    } catch (err) {
      talkBtn.disabled = false;
      setStatus(`Something went wrong (${err.message}). Please try again.`, { error: true });
    } finally {
      busy = false;
    }
  }

  startBtn.addEventListener("click", startCall);

  // Pointer events cover mouse and touch; capture keeps "release" working if the finger slides off
  talkBtn.addEventListener("pointerdown", e => { talkBtn.setPointerCapture(e.pointerId); startRecording(); });
  talkBtn.addEventListener("pointerup", stopRecording);
  talkBtn.addEventListener("pointercancel", stopRecording);
  talkBtn.addEventListener("contextmenu", e => e.preventDefault());

  document.addEventListener("keydown", e => {
    if (e.code === "Space" && !e.repeat && document.activeElement !== startBtn) { e.preventDefault(); startRecording(); }
  });
  document.addEventListener("keyup", e => {
    if (e.code === "Space") { e.preventDefault(); stopRecording(); }
  });

  fetch("/api/info").then(r => r.json()).then(info => {
    document.getElementById("biz-name").textContent = info.name;
    document.getElementById("biz-tagline").textContent = info.tagline || "AI receptionist";
    document.title = `${info.name} · Talkse`;
  }).catch(() => {});

  if (!navigator.mediaDevices || !window.MediaRecorder) {
    startBtn.disabled = true;
    setStatus("This browser can't record audio. Use Chrome, Edge, Firefox or Safari over HTTPS.", { error: true });
  }
</script>
</body>
</html>
